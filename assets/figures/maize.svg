<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Poverty gap in Malawi after a maize price rise under each compensation rule" font-family="'Segoe UI',Inter,Arial,sans-serif"><title>Poverty gap in Malawi after a maize price rise under each compensation rule</title><rect width="480" height="300" fill="#fff"/><line x1="199.6" y1="20.0" x2="199.6" y2="240.0" stroke="#60727e" stroke-width="1.5" stroke-dasharray="5 5"/><text x="156.0" y="48.0" font-size="17" fill="#355367" text-anchor="end" font-weight="400">No compensation</text><line x1="172.0" y1="42.0" x2="446.0" y2="42.0" stroke="#e8eef1" stroke-width="1"/><circle cx="421.2" cy="42" r="9" fill="#aa6849"/><text x="156.0" y="92.0" font-size="17" fill="#355367" text-anchor="end" font-weight="400">Equal per person</text><line x1="172.0" y1="86.0" x2="446.0" y2="86.0" stroke="#e8eef1" stroke-width="1"/><circle cx="315.9" cy="86" r="9" fill="#376b88"/><text x="156.0" y="136.0" font-size="17" fill="#355367" text-anchor="end" font-weight="400">Geographic</text><line x1="172.0" y1="130.0" x2="446.0" y2="130.0" stroke="#e8eef1" stroke-width="1"/><circle cx="302.8" cy="130" r="9" fill="#376b88"/><text x="156.0" y="180.0" font-size="17" fill="#355367" text-anchor="end" font-weight="400">Maize exposure</text><line x1="172.0" y1="174.0" x2="446.0" y2="174.0" stroke="#e8eef1" stroke-width="1"/><circle cx="287.4" cy="174" r="9" fill="#376b88"/><text x="156.0" y="224.0" font-size="17" fill="#355367" text-anchor="end" font-weight="400">Poverty proxy</text><line x1="172.0" y1="218.0" x2="446.0" y2="218.0" stroke="#e8eef1" stroke-width="1"/><circle cx="257.8" cy="218" r="9" fill="#376b88"/><text x="205.6" y="274.0" font-size="16" fill="#355367" text-anchor="start" font-weight="400">before the price rise: 15.7</text></svg>
